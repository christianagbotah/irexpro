# ============================================================
# iRexPro — Nginx staging example (AlmaLinux 9.8 / Webuzo)
# Sprint 21 — verified on the real staging dry-run.
#
# This file contains NO secrets. All domain names, ports, and cert paths are
# examples — replace with your real values. See
# docs/runbooks/production-deployment-vps-webuzo.md §8 for the full guide.
#
# Install (AlmaLinux/Webuzo):
#   sudo cp infrastructure/nginx/irexpro-staging.example.conf /etc/nginx/conf.d/irexpro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install (Ubuntu):
#   sudo cp infrastructure/nginx/irexpro-staging.example.conf /etc/nginx/sites-available/irexpro.conf
#   sudo ln -s /etc/nginx/sites-available/irexpro.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Upstreams — match the ports in apps/api/.env (APP_PORT) and
# services/ai-engine/.env (AI_ENGINE_PORT).
#
# The AI engine upstream is intentionally NOT defined here because it must NOT
# be publicly proxied. The NestJS API talks to it internally at
# http://127.0.0.1:8011. Do NOT add a public location block for the AI engine.

upstream irexpro_api {
    server 127.0.0.1:3010;     # NestJS API — APP_PORT in apps/api/.env
    keepalive 32;
}

upstream irexpro_frontend {
    server 127.0.0.1:3005;     # Next.js frontend — adjust to your frontend port
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name irexpro.lightworldtech.com;     # your domain

    # Webuzo/Certbot ACME challenge passthrough (if needed)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — public edge ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name irexpro.lightworldtech.com;     # your domain

    ssl_certificate     /etc/letsencrypt/live/irexpro.lightworldtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irexpro.lightworldtech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (do NOT globally hide Content-Security-Policy — the
    # frontend manages its own CSP; the API does not set one).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── NestJS API (public) — ^~ takes precedence over the frontend catch-all ──
    # Do NOT define a duplicate `location ^~ /` block — Nginx will reject it.
    location ^~ /api/v1/ {
        proxy_pass http://irexpro_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # WebSocket for the realtime gateway
        proxy_read_timeout 75s;

        # Payment webhooks under /api/v1/payments/webhooks/ need the full raw
        # request body for HMAC signature verification. proxy_request_buffering
        # on (the default) ensures NestJS receives the complete body before the
        # route handler runs.
        proxy_request_buffering on;
    }

    # ── Next.js static assets (public) — immutable, cache aggressively ─────────
    location ^~ /_next/static/ {
        proxy_pass http://irexpro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend (public) — catch-all, proxies everything else to Next.js ──────
    location / {
        proxy_pass http://irexpro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # Next.js HMR (dev) / WebSocket
        proxy_read_timeout 75s;
    }

    # NOTE: there is intentionally NO public location block for the AI engine
    # (port 8011). The AI engine is internal-only — the NestJS API communicates
    # with it at http://127.0.0.1:8011. Do NOT proxy /ai-engine/ or any other
    # path to the AI engine through Nginx or Cloudflare.
}
