name: Sprint 47 Lock Refresh (Temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lock:
    if: github.head_ref == 'feat/production-release-security-health'
    runs-on: ubuntu-24.04
    env:
      PNPM_VERSION: 10.34.5
      NODE_VERSION: 22
    steps:
      - name: Checkout Sprint 47 head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/production-release-security-health
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Regenerate deterministic workspace lock
        run: pnpm install --no-frozen-lockfile

      - name: Build API
        run: pnpm --filter @irexpro/api build

      - name: Build Web
        run: pnpm --filter @irexpro/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3010/api/v1

      - name: Build Admin
        run: pnpm --filter @irexpro/admin build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3010/api/v1

      - name: Commit refreshed lock only after builds pass
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): refresh pnpm lock after patched dependencies"
          git push origin HEAD:feat/production-release-security-health
