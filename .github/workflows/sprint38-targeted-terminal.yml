name: Sprint 38 Targeted Terminal

on:
  push:
    branches:
      - architect/sprint38-targeted-terminal-20260829

permissions:
  contents: read

jobs:
  targeted-web:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10.34.5'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3999/api/v1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        run: pnpm exec next build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Decision Explorer and terminal specs across configured viewports
        working-directory: apps/web
        env:
          CI: 'true'
        run: pnpm exec playwright test e2e/ai-decision-explorer.spec.ts e2e/trader-terminal.spec.ts
