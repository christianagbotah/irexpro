name: SDK 52 Dependency Materializer

on:
  push:
    branches:
      - mobile/sprint50-expo52-upgrade
    paths:
      - '.github/workflows/sdk52-dependency-materializer.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  EXPO_NO_TELEMETRY: '1'

jobs:
  materialize:
    name: Generate and apply SDK 52 package and lock evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install current baseline from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Upgrade Expo to SDK 52 and align mobile dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/mobile add 'expo@^52.0.0'
          pnpm --dir apps/mobile exec expo install --fix --pnpm

      - name: Verify generated change scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generated tracked changes:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              apps/mobile/app.json|apps/mobile/package.json|pnpm-lock.yaml) ;;
              *)
                echo "Unexpected generated tracked change: $path"
                exit 1
                ;;
            esac
          done
          test "${#changed[@]}" -eq 3

      - name: Capture generated dependency evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p sdk52-generated
          cp apps/mobile/app.json sdk52-generated/app.json
          cp apps/mobile/package.json sdk52-generated/package.json
          cp pnpm-lock.yaml sdk52-generated/pnpm-lock.yaml
          git diff -- apps/mobile/app.json apps/mobile/package.json pnpm-lock.yaml > sdk52-generated/sdk52-dependency.diff
          git diff --stat -- apps/mobile/app.json apps/mobile/package.json pnpm-lock.yaml > sdk52-generated/sdk52-dependency.stat

      - name: Upload generated SDK 52 dependency evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk52-generated-dependencies
          path: sdk52-generated/
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact generated files to isolated upgrade branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- apps/mobile/app.json apps/mobile/package.json pnpm-lock.yaml
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'Staged generated changes:\n'
          printf '  %s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 3
          test "${staged[0]}" = 'apps/mobile/app.json'
          test "${staged[1]}" = 'apps/mobile/package.json'
          test "${staged[2]}" = 'pnpm-lock.yaml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sprint 50: generate Expo SDK 52 dependency alignment'
          git push origin HEAD:mobile/sprint50-expo52-upgrade
