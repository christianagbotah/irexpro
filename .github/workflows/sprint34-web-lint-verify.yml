name: Sprint 34 Web Lint Verify

on:
  push:
    branches:
      - architect/sprint34-web-lint-verify

jobs:
  web-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @irexpro/web lint
