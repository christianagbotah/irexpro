name: Release Security

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  PYTHON_VERSION: '3.11'
  PIP_AUDIT_VERSION: '2.10.1'
  PIP_TOOLS_VERSION: '7.6.1'
  SYFT_VERSION: 'v1.51.0'

jobs:
  # Sprint 47 bootstrap only. This job is deliberately restricted to the
  # repository-owned Sprint 47 branch and will be removed before release.
  # It gives CI write permission only long enough to commit the deterministic
  # pip-compile lock generated from pyproject.toml.
  bootstrap-python-lock:
    name: Bootstrap Python Runtime Lock
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/production-release-security-health' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'christianagbotah'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Sprint 47 branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==${PIP_TOOLS_VERSION}"

      - name: Generate repository-controlled runtime lock
        env:
          CUSTOM_COMPILE_COMMAND: "python -m piptools compile services/ai-engine/pyproject.toml --generate-hashes"
        run: |
          python -m piptools compile \
            services/ai-engine/pyproject.toml \
            --generate-hashes \
            --strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file services/ai-engine/requirements.lock

      - name: Commit lock only when generated content changed
        shell: bash
        run: |
          if git diff --quiet -- services/ai-engine/requirements.lock && git ls-files --error-unmatch services/ai-engine/requirements.lock >/dev/null 2>&1; then
            echo "Python runtime lock already matches the deterministic compiler output."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai-engine/requirements.lock
          git commit -m "chore(ai): lock production runtime dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  tracked-secret-scan:
    name: Tracked Source Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Scan tracked source without printing secret values
        run: node scripts/security/scan-tracked-secrets.mjs

  node-dependency-audit:
    name: VPS Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Materialize isolated production dependency graphs
        shell: bash
        run: |
          rm -rf security-artifacts/deploy
          mkdir -p security-artifacts/deploy
          pnpm --filter @irexpro/api --prod deploy --legacy security-artifacts/deploy/api
          pnpm --filter @irexpro/web --prod deploy --legacy security-artifacts/deploy/web
          pnpm --filter @irexpro/admin --prod deploy --legacy security-artifacts/deploy/admin

      - name: Audit API production graph at high severity threshold
        shell: bash
        run: |
          set +e
          pnpm --dir security-artifacts/deploy/api audit --prod --audit-level=high --json > security-artifacts/api-pnpm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "API production dependency audit found high/critical vulnerabilities or could not complete."
            exit "$audit_status"
          fi

      - name: Audit Web production graph at high severity threshold
        shell: bash
        run: |
          set +e
          pnpm --dir security-artifacts/deploy/web audit --prod --audit-level=high --json > security-artifacts/web-pnpm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "Web production dependency audit found high/critical vulnerabilities or could not complete."
            exit "$audit_status"
          fi

      - name: Audit Admin production graph at high severity threshold
        shell: bash
        run: |
          set +e
          pnpm --dir security-artifacts/deploy/admin audit --prod --audit-level=high --json > security-artifacts/admin-pnpm-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "Admin production dependency audit found high/critical vulnerabilities or could not complete."
            exit "$audit_status"
          fi

      - name: Upload deployable dependency audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vps-production-dependency-audit
          path: |
            security-artifacts/api-pnpm-audit.json
            security-artifacts/web-pnpm-audit.json
            security-artifacts/admin-pnpm-audit.json
          if-no-files-found: warn
          retention-days: 30

  python-lock-and-audit:
    name: Python Lock Integrity & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pinned dependency security tooling
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-audit==${PIP_AUDIT_VERSION}" \
            "pip-tools==${PIP_TOOLS_VERSION}"

      - name: Compile deterministic Python runtime lock
        shell: bash
        env:
          CUSTOM_COMPILE_COMMAND: "python -m piptools compile services/ai-engine/pyproject.toml --generate-hashes"
        run: |
          mkdir -p security-artifacts
          python -m piptools compile \
            services/ai-engine/pyproject.toml \
            --generate-hashes \
            --strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file security-artifacts/ai-engine-requirements.lock

      - name: Verify committed Python lock is current
        id: lock_check
        shell: bash
        run: |
          if [ ! -f services/ai-engine/requirements.lock ]; then
            echo "services/ai-engine/requirements.lock is missing."
            echo "Use the generated lock artifact from this run and commit it."
            exit 1
          fi
          cmp services/ai-engine/requirements.lock security-artifacts/ai-engine-requirements.lock

      - name: Audit locked Python runtime dependencies
        if: always() && steps.lock_check.outcome == 'success'
        shell: bash
        run: |
          set +e
          python -m pip_audit \
            --requirement services/ai-engine/requirements.lock \
            --format json \
            --output security-artifacts/pip-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ]; then
            echo "Python dependency audit found known vulnerabilities or could not complete."
            exit "$audit_status"
          fi

      - name: Upload Python lock and audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-lock-and-audit
          path: |
            security-artifacts/ai-engine-requirements.lock
            security-artifacts/pip-audit.json
          if-no-files-found: warn
          retention-days: 30

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create artifact directory
        run: mkdir -p security-artifacts

      - name: Generate repository SBOM with pinned Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: security-artifacts/irexpro-sbom.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: irexpro-sbom
          path: security-artifacts/irexpro-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript,python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
