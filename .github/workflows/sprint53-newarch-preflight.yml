name: Sprint 53 New Architecture Preflight

on:
  push:
    branches:
      - mobile/sprint53-new-architecture
    paths:
      - '.github/workflows/sprint53-newarch-preflight.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  preflight:
    name: Prove SDK 54 New Architecture compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Apply SDK 54 isolated-install and default-Metro probe
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - 'apps/*'
            - 'packages/*'
            - 'services/*'
          EOF
          cat > apps/mobile/metro.config.js <<'EOF'
          const { getDefaultConfig } = require('expo/metro-config');

          module.exports = getDefaultConfig(__dirname);
          EOF
          git diff -- pnpm-workspace.yaml apps/mobile/metro.config.js

      - name: Install dependencies from frozen lockfile with isolated linker
        run: pnpm install --frozen-lockfile

      - name: Run Expo Doctor against React Native Directory
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/mobile
          pnpm dlx expo-doctor@latest

      - name: Validate Expo dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Validate release configuration
        run: pnpm --filter @irexpro/mobile validate:release-config

      - name: Prove workspace React runtime isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const path = require('node:path');
          const { createRequire } = require('node:module');
          function version(workspace, packageName) {
            return createRequire(path.resolve(workspace, 'package.json'))(`${packageName}/package.json`).version;
          }
          const checks = {
            rootReact: version('.', 'react'),
            rootReactDOM: version('.', 'react-dom'),
            webReact: version('apps/web', 'react'),
            webReactDOM: version('apps/web', 'react-dom'),
            adminReact: version('apps/admin', 'react'),
            adminReactDOM: version('apps/admin', 'react-dom'),
            mobileReact: version('apps/mobile', 'react'),
            mobileReactNative: version('apps/mobile', 'react-native'),
            mobileExpo: version('apps/mobile', 'expo'),
          };
          console.log(checks);
          for (const key of ['rootReact','rootReactDOM','webReact','webReactDOM','adminReact','adminReactDOM']) {
            if (checks[key] !== '19.2.8') throw new Error(`${key} must remain 19.2.8, got ${checks[key]}`);
          }
          if (checks.mobileReact !== '19.1.0') throw new Error(`Mobile React must remain 19.1.0, got ${checks.mobileReact}`);
          if (checks.mobileReactNative !== '0.81.5') throw new Error(`Mobile RN must remain 0.81.5, got ${checks.mobileReactNative}`);
          if (checks.mobileExpo !== '54.0.37') throw new Error(`Mobile Expo must remain 54.0.37, got ${checks.mobileExpo}`);
          NODE

      - name: Typecheck mobile app
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .ci-export-android
          --clear

      - name: Export iOS bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .ci-export-ios
          --clear

      - name: Build web app with isolated workspace layout
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'
        run: pnpm --filter @irexpro/web build

      - name: Build admin app with isolated workspace layout
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3998/api/v1'
        run: pnpm --filter @irexpro/admin build

      - name: Remove disposable Metro exports
        run: rm -rf apps/mobile/.ci-export-android apps/mobile/.ci-export-ios

      - name: Generate disposable Android and iOS native projects
        run: pnpm --filter @irexpro/mobile exec expo prebuild --platform all --no-install --clean

      - name: Contain prebuild tracked-file mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Tracked changes after prebuild:\n%s\n' "${changed[*]}"
          printf '%s\n' "${changed[@]}" | sort > /tmp/prebuild-actual
          printf '%s\n' apps/mobile/metro.config.js apps/mobile/package.json pnpm-workspace.yaml | sort > /tmp/prebuild-expected
          diff -u /tmp/prebuild-expected /tmp/prebuild-actual
          git diff -- apps/mobile/package.json

      - name: Prove Android and iOS generated New Architecture state
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^newArchEnabled=true$' apps/mobile/android/gradle.properties
          grep -Eq "RCT_NEW_ARCH_ENABLED.*newArchEnabled.*false" apps/mobile/ios/Podfile
          node <<'NODE'
          const fs = require('node:fs');
          const props = JSON.parse(fs.readFileSync('apps/mobile/ios/Podfile.properties.json', 'utf8'));
          if (props.newArchEnabled === 'false') {
            throw new Error('Generated iOS project explicitly opts out of New Architecture');
          }
          console.log(`Generated iOS project does not opt out of New Architecture (property=${JSON.stringify(props.newArchEnabled)}).`);
          NODE
          echo 'Generated Android and iOS projects use the SDK 54 New Architecture path.'

      - name: Restore disposable prebuild source mutation
        run: git restore apps/mobile/package.json

      - name: Remove disposable native projects
        run: rm -rf apps/mobile/android apps/mobile/ios

      - name: Enforce probe scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Runtime probe changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' apps/mobile/metro.config.js pnpm-workspace.yaml | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
