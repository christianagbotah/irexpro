name: Sprint 53 New Architecture Preflight

on:
  push:
    branches:
      - mobile/sprint53-new-architecture
    paths:
      - '.github/workflows/sprint53-newarch-preflight.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  preflight:
    name: Prove SDK 54 New Architecture compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run Expo Doctor against React Native Directory
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/mobile
          pnpm dlx expo-doctor@latest

      - name: Validate Expo dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Validate release configuration
        run: pnpm --filter @irexpro/mobile validate:release-config

      - name: Typecheck mobile app
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .ci-export-android
          --clear

      - name: Export iOS bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .ci-export-ios
          --clear

      - name: Remove disposable Metro exports
        run: rm -rf apps/mobile/.ci-export-android apps/mobile/.ci-export-ios

      - name: Generate disposable Android and iOS native projects
        run: pnpm --filter @irexpro/mobile exec expo prebuild --platform all --no-install --clean

      - name: Prove Android and iOS generated New Architecture flags
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^newArchEnabled=true$' apps/mobile/android/gradle.properties
          node <<'NODE'
          const fs = require('node:fs');
          const props = JSON.parse(fs.readFileSync('apps/mobile/ios/Podfile.properties.json', 'utf8'));
          if (props.newArchEnabled !== 'true') {
            throw new Error(`Expected iOS newArchEnabled=true, got ${JSON.stringify(props.newArchEnabled)}`);
          }
          console.log('Generated native projects enable New Architecture on Android and iOS.');
          NODE

      - name: Ensure prebuild did not mutate tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          unexpected="$(git status --porcelain --untracked-files=no)"
          if [ -n "$unexpected" ]; then
            echo 'expo prebuild modified tracked source unexpectedly:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
