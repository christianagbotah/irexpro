name: SDK 53 Dependency Materializer

on:
  push:
    branches:
      - mobile/sprint51-expo53-upgrade
    paths:
      - '.github/workflows/sdk53-dependency-materializer.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  EXPO_NO_TELEMETRY: '1'

jobs:
  materialize:
    name: Generate SDK 53 dependency evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install SDK 52 baseline from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Upgrade Expo to SDK 53 and align mobile dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/mobile add 'expo@^53.0.0'
          pnpm --dir apps/mobile exec expo install --fix --pnpm

      - name: Verify generated change scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generated tracked changes:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 2
          for path in "${changed[@]}"; do
            case "$path" in
              apps/mobile/package.json|apps/mobile/app.json|pnpm-lock.yaml) ;;
              *)
                echo "Unexpected generated tracked change: $path"
                exit 1
                ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | grep -qx 'apps/mobile/package.json'
          printf '%s\n' "${changed[@]}" | grep -qx 'pnpm-lock.yaml'

      - name: Capture generated dependency evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p sdk53-generated
          cp apps/mobile/package.json sdk53-generated/package.json
          cp apps/mobile/app.json sdk53-generated/app.json
          cp pnpm-lock.yaml sdk53-generated/pnpm-lock.yaml
          git diff -- apps/mobile/package.json apps/mobile/app.json pnpm-lock.yaml > sdk53-generated/sdk53-dependency.diff
          git diff --stat -- apps/mobile/package.json apps/mobile/app.json pnpm-lock.yaml > sdk53-generated/sdk53-dependency.stat

      - name: Upload generated SDK 53 dependency evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk53-generated-dependencies
          path: sdk53-generated/
          if-no-files-found: error
          retention-days: 7
