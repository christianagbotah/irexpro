name: SDK 54 Dependency Materializer

on:
  push:
    branches:
      - mobile/sprint52-expo54-upgrade
    paths:
      - '.github/workflows/sdk54-materialize.yml'

permissions:
  contents: read

concurrency:
  group: sdk54-materialize-${{ github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  materialize:
    name: Materialize and validate Expo SDK 54 graph
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact materializer commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install SDK 53 baseline from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Materialize SDK 54-compatible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --dir apps/mobile add 'expo@^54.0.0'
          pnpm --dir apps/mobile exec expo install --fix --pnpm
          pnpm --dir apps/mobile exec expo install react-native-safe-area-context --pnpm

      - name: Enforce generated dependency scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generated changes:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              apps/mobile/package.json|pnpm-lock.yaml) ;;
              *) echo "Unexpected generated file: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 2

      - name: Validate Expo dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Validate workspace React runtime isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const path = require('node:path');
          const { createRequire } = require('node:module');

          function packageVersion(workspace, packageName) {
            const req = createRequire(path.resolve(workspace, 'package.json'));
            return req(`${packageName}/package.json`).version;
          }

          const versions = {
            rootReact: packageVersion('.', 'react'),
            rootReactDOM: packageVersion('.', 'react-dom'),
            webReact: packageVersion('apps/web', 'react'),
            webReactDOM: packageVersion('apps/web', 'react-dom'),
            adminReact: packageVersion('apps/admin', 'react'),
            adminReactDOM: packageVersion('apps/admin', 'react-dom'),
            mobileReact: packageVersion('apps/mobile', 'react'),
            mobileReactNative: packageVersion('apps/mobile', 'react-native'),
            mobileExpo: packageVersion('apps/mobile', 'expo'),
          };
          console.log(versions);

          for (const key of ['rootReact', 'rootReactDOM', 'webReact', 'webReactDOM', 'adminReact', 'adminReactDOM']) {
            if (versions[key] !== '19.2.8') throw new Error(`${key} must remain 19.2.8, got ${versions[key]}`);
          }
          if (!versions.mobileReact.startsWith('19.1.')) throw new Error(`Mobile React must be 19.1.x, got ${versions.mobileReact}`);
          if (!versions.mobileReactNative.startsWith('0.81.')) throw new Error(`Mobile RN must be 0.81.x, got ${versions.mobileReactNative}`);
          if (!versions.mobileExpo.startsWith('54.')) throw new Error(`Mobile Expo must be 54.x, got ${versions.mobileExpo}`);
          NODE

      - name: Typecheck mobile app
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .ci-export-android
          --clear

      - name: Export iOS bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .ci-export-ios
          --clear

      - name: Build web app against materialized root lock
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'
        run: pnpm --filter @irexpro/web build

      - name: Build admin app against materialized root lock
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3998/api/v1'
        run: pnpm --filter @irexpro/admin build

      - name: Prepare dependency evidence
        if: always()
        shell: bash
        run: |
          rm -rf sdk54-materialized apps/mobile/.ci-export-android apps/mobile/.ci-export-ios
          mkdir -p sdk54-materialized/apps/mobile
          cp apps/mobile/package.json sdk54-materialized/apps/mobile/package.json
          cp apps/mobile/app.json sdk54-materialized/apps/mobile/app.json
          cp pnpm-lock.yaml sdk54-materialized/pnpm-lock.yaml
          git diff -- apps/mobile/package.json pnpm-lock.yaml > sdk54-materialized/dependency.diff
          git diff --stat > sdk54-materialized/diff.stat
          git status --short > sdk54-materialized/status.txt

      - name: Upload generated dependency evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk54-generated-dependencies
          path: sdk54-materialized
          retention-days: 3
          if-no-files-found: error
