name: React Resolution Diagnostic

on:
  push:
    branches:
      - diag/sprint51-react-resolution
    paths:
      - '.github/workflows/react-resolution-diagnostic.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'

jobs:
  diagnose:
    name: Diagnose workspace React resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install exact candidate lockfile
        run: pnpm install --frozen-lockfile

      - name: Show declared dependency graph
        run: pnpm list react react-dom --recursive --depth 1 || true

      - name: Resolve runtime packages from each workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          for workspace in apps/web apps/admin apps/mobile; do
            echo "=== $workspace ==="
            cd "$GITHUB_WORKSPACE/$workspace"
            for pkg in react react-dom next; do
              entry="$(node -e "try{process.stdout.write(require.resolve('$pkg'))}catch(e){}")"
              if [ -n "$entry" ]; then
                version="$(node -e "try{process.stdout.write(require('$pkg/package.json').version)}catch(e){process.stdout.write('unknown')}")"
                echo "$pkg version=$version entry=$entry"
              else
                echo "$pkg unresolved"
              fi
              if [ -e "node_modules/$pkg" ]; then
                echo "$pkg local=$(readlink -f "node_modules/$pkg" || true)"
              else
                echo "$pkg local=<absent>"
              fi
            done
          done
          cd "$GITHUB_WORKSPACE"
          echo '=== repository root ==='
          for pkg in react react-dom next; do
            if [ -e "node_modules/$pkg" ]; then
              echo "$pkg root=$(readlink -f "node_modules/$pkg" || true)"
              node -e "try{console.log('$pkg root-version='+require('./node_modules/$pkg/package.json').version)}catch(e){console.log('$pkg root-version=unknown')}"
            else
              echo "$pkg root=<absent>"
            fi
          done

      - name: Reproduce web and admin builds
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3999/api/v1
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== WEB BUILD ==='
          (cd apps/web && pnpm exec next build) || true
          echo '=== ADMIN BUILD ==='
          (cd apps/admin && pnpm exec next build) || true
