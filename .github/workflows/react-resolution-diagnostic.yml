name: React Resolution Diagnostic

on:
  push:
    branches:
      - diag/sprint51-react-resolution
    paths:
      - '.github/workflows/react-resolution-diagnostic.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'

jobs:
  diagnose:
    name: Diagnose workspace React resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install exact candidate lockfile
        run: pnpm install --frozen-lockfile

      - name: Show declared dependency graph
        run: pnpm list react react-dom --recursive --depth 1

      - name: Resolve runtime packages from each workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          for workspace in apps/web apps/admin apps/mobile; do
            echo "=== $workspace ==="
            (
              cd "$workspace"
              node <<'NODE'
const fs = require('fs');
const path = require('path');
for (const pkg of ['react', 'react-dom', 'next']) {
  try {
    const entry = require.resolve(pkg);
    let dir = path.dirname(entry);
    let found = null;
    while (dir !== path.dirname(dir)) {
      const candidate = path.join(dir, 'package.json');
      if (fs.existsSync(candidate)) {
        const manifest = JSON.parse(fs.readFileSync(candidate, 'utf8'));
        if (manifest.name === pkg) {
          found = { version: manifest.version, manifest: candidate, entry };
          break;
        }
      }
      dir = path.dirname(dir);
    }
    console.log(pkg, found || { entry });
  } catch (error) {
    console.log(pkg, 'UNRESOLVED', error.message);
  }
}
NODE
            )
            for pkg in react react-dom next; do
              if [ -e "$workspace/node_modules/$pkg" ]; then
                printf '%s local path: ' "$pkg"
                readlink -f "$workspace/node_modules/$pkg" || true
              else
                echo "$pkg local path: <absent>"
              fi
            done
          done
          echo '=== repository root ==='
          for pkg in react react-dom next; do
            if [ -e "node_modules/$pkg" ]; then
              printf '%s root path: ' "$pkg"
              readlink -f "node_modules/$pkg" || true
              node -e "try{console.log('$pkg root version:',require('./node_modules/$pkg/package.json').version)}catch(e){console.log('$pkg root version: unresolved')}"
            else
              echo "$pkg root path: <absent>"
            fi
          done

      - name: Reproduce web and admin builds
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3999/api/v1
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== WEB BUILD ==='
          (cd apps/web && pnpm exec next build) || true
          echo '=== ADMIN BUILD ==='
          (cd apps/admin && pnpm exec next build) || true
