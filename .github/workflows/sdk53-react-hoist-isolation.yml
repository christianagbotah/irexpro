name: SDK 53 React Hoist Isolation

on:
  push:
    branches:
      - mobile/sprint51-expo53-upgrade
    paths:
      - '.github/workflows/sdk53-react-hoist-isolation.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'
  NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'

jobs:
  validate:
    name: Validate deterministic React resolution across workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install current SDK 53 candidate from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Pin shared web React runtime at workspace root
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm add --workspace-root --save-exact react@19.2.8 react-dom@19.2.8

      - name: Verify generated change scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generated tracked changes:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'package.json'
          test "${changed[1]}" = 'pnpm-lock.yaml'

      - name: Verify workspace React resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const path = require('node:path');
          function inspect(label, cwd) {
            const reactPkg = require(require.resolve('react/package.json', { paths: [cwd] }));
            const reactPath = require.resolve('react/package.json', { paths: [cwd] });
            let reactDomVersion = null;
            let reactDomPath = null;
            try {
              const resolved = require.resolve('react-dom/package.json', { paths: [cwd] });
              reactDomVersion = require(resolved).version;
              reactDomPath = resolved;
            } catch {}
            console.log(`${label}: react=${reactPkg.version} @ ${reactPath}`);
            if (reactDomVersion) console.log(`${label}: react-dom=${reactDomVersion} @ ${reactDomPath}`);
            return { react: reactPkg.version, reactDom: reactDomVersion, reactPath, reactDomPath };
          }
          const root = process.cwd();
          const rootInfo = inspect('root', root);
          const web = inspect('web', path.join(root, 'apps/web'));
          const admin = inspect('admin', path.join(root, 'apps/admin'));
          const mobile = inspect('mobile', path.join(root, 'apps/mobile'));
          if (rootInfo.react !== '19.2.8' || rootInfo.reactDom !== '19.2.8') throw new Error('Root React runtime is not 19.2.8');
          if (web.react !== '19.2.8' || web.reactDom !== '19.2.8') throw new Error('Web React runtime mismatch');
          if (admin.react !== '19.2.8' || admin.reactDom !== '19.2.8') throw new Error('Admin React runtime mismatch');
          if (mobile.react !== '19.0.0') throw new Error(`Mobile React runtime mismatch: ${mobile.react}`);
          if (mobile.reactPath === web.reactPath) throw new Error('Mobile and Web unexpectedly resolve the same React installation');
          NODE

      - name: Build Web with isolated React 19.2.8
        working-directory: apps/web
        run: pnpm exec next build

      - name: Build Admin with isolated React 19.2.8
        working-directory: apps/admin
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3998/api/v1'
        run: pnpm exec next build

      - name: Validate Expo SDK 53 alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Typecheck Mobile
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .sdk53-react-isolation-android
          --clear

      - name: Export iOS bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .sdk53-react-isolation-ios
          --clear

      - name: Remove disposable mobile exports
        run: rm -rf apps/mobile/.sdk53-react-isolation-android apps/mobile/.sdk53-react-isolation-ios

      - name: Commit verified React isolation files
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -- package.json pnpm-lock.yaml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = 'package.json'
          test "${staged[1]}" = 'pnpm-lock.yaml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sprint 51: isolate web and mobile React runtimes'
          git push origin HEAD:refs/heads/mobile/sprint51-expo53-upgrade
