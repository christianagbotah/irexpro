name: React Hoist Fix Validation

on:
  push:
    branches:
      - diag/sprint51-react-resolution
    paths:
      - '.github/workflows/react-hoist-fix-validation.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  validate:
    name: Validate root React hoist anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install exact failing candidate
        run: pnpm install --frozen-lockfile

      - name: Add root React hoist anchor with pnpm
        run: pnpm add -Dw react@19.2.8 react-dom@19.2.8

      - name: Verify runtime resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          test "$(cd apps/web && node -p "require('react/package.json').version")" = '19.2.8'
          test "$(cd apps/admin && node -p "require('react/package.json').version")" = '19.2.8'
          test "$(cd apps/mobile && node -p "require('react/package.json').version")" = '19.0.0'

      - name: Build web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3999/api/v1
        run: pnpm --filter @irexpro/web build

      - name: Build admin
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3998/api/v1
        run: pnpm --filter @irexpro/admin build

      - name: Validate Expo dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Typecheck mobile
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: pnpm --filter @irexpro/mobile exec expo export --platform android --output-dir .diag-export-android --clear

      - name: Export iOS bundle
        run: pnpm --filter @irexpro/mobile exec expo export --platform ios --output-dir .diag-export-ios --clear

      - name: Clean diagnostic export output
        run: rm -rf apps/mobile/.diag-export-android apps/mobile/.diag-export-ios

      - name: Verify generated scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Generated changes:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'package.json'
          test "${changed[1]}" = 'pnpm-lock.yaml'
