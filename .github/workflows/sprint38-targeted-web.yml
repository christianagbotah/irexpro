name: Sprint 38 Targeted Web

on:
  push:
    branches:
      - architect/sprint38-targeted-web

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'
  NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'

jobs:
  targeted-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        run: pnpm exec next build

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Decision Explorer spec across configured viewports
        working-directory: apps/web
        run: pnpm exec playwright test e2e/ai-decision-explorer.spec.ts
        env:
          CI: 'true'
