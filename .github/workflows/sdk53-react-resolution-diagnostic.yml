name: SDK 53 React Resolution Diagnostic

on:
  push:
    branches:
      - mobile/sprint51-expo53-upgrade
    paths:
      - '.github/workflows/sdk53-react-resolution-diagnostic.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'

jobs:
  diagnose:
    name: Diagnose workspace React resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Print declared and resolved React versions
        shell: bash
        run: |
          set -Eeuo pipefail
          for dir in . apps/web apps/admin apps/mobile; do
            echo "===== $dir ====="
            (
              cd "$dir"
              node - <<'NODE'
              const fs = require('fs');
              const path = require('path');
              const cwd = process.cwd();
              const own = fs.existsSync(path.join(cwd, 'package.json')) ? require(path.join(cwd, 'package.json')) : {};
              console.log('declared react:', own.dependencies?.react ?? own.devDependencies?.react ?? '<none>');
              console.log('declared react-dom:', own.dependencies?.['react-dom'] ?? own.devDependencies?.['react-dom'] ?? '<none>');
              for (const pkg of ['react', 'react-dom']) {
                try {
                  const resolved = require.resolve(`${pkg}/package.json`, { paths: [cwd] });
                  const meta = require(resolved);
                  console.log(`${pkg}:`, meta.version, resolved);
                } catch (error) {
                  console.log(`${pkg}: <unresolved>`, error.code || error.message);
                }
              }
NODE
            )
          done
      - name: Show relevant node_modules placements
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -maxdepth 4 -type f \( -path '*/react/package.json' -o -path '*/react-dom/package.json' \) -print | sort
