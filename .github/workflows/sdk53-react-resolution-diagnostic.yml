name: SDK 53 React Resolution Diagnostic

on:
  push:
    branches:
      - mobile/sprint51-expo53-upgrade
    paths:
      - '.github/workflows/sdk53-react-resolution-diagnostic.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'

jobs:
  diagnose:
    name: Diagnose workspace React resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Print declared and resolved React versions
        shell: bash
        run: |
          set -Eeuo pipefail
          for dir in . apps/web apps/admin apps/mobile; do
            echo "===== $dir ====="
            cd "$GITHUB_WORKSPACE/$dir"
            node -p "'declared react: ' + ((require('./package.json').dependencies || {}).react || (require('./package.json').devDependencies || {}).react || '<none>')"
            node -p "'declared react-dom: ' + ((require('./package.json').dependencies || {})['react-dom'] || (require('./package.json').devDependencies || {})['react-dom'] || '<none>')"
            node -p "'resolved react: ' + require(require.resolve('react/package.json')).version + ' ' + require.resolve('react/package.json')" || true
            node -p "'resolved react-dom: ' + require(require.resolve('react-dom/package.json')).version + ' ' + require.resolve('react-dom/package.json')" || true
          done
      - name: Show relevant node_modules placements
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -maxdepth 5 -type f \( -path '*/react/package.json' -o -path '*/react-dom/package.json' \) -print | sort
