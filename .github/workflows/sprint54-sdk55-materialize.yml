name: Sprint 54 SDK 55 Preflight

on:
  push:
    branches:
      - mobile/sprint54-expo-sdk55
    paths:
      - '.github/workflows/sprint54-sdk55-materialize.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '10.34.5'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_BASE_URL: 'http://127.0.0.1:3010/api/v1'

jobs:
  preflight:
    name: Validate committed Expo SDK 55 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact candidate and committed monorepo baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          grep -Fxq "const { getDefaultConfig } = require('expo/metro-config');" apps/mobile/metro.config.js
          grep -Fxq 'module.exports = getDefaultConfig(__dirname);' apps/mobile/metro.config.js
          ! grep -q 'watchFolders\|nodeModulesPaths' apps/mobile/metro.config.js
          ! grep -q '^nodeLinker:' pnpm-workspace.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install committed workspace from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run Expo Doctor against React Native Directory
        shell: bash
        run: |
          set -Eeuo pipefail
          cd apps/mobile
          pnpm dlx expo-doctor@latest

      - name: Validate Expo dependency alignment
        run: pnpm --filter @irexpro/mobile exec expo install --check

      - name: Validate release configuration
        run: pnpm --filter @irexpro/mobile validate:release-config

      - name: Prove workspace React runtime isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const path = require('node:path');
          const { createRequire } = require('node:module');
          function version(workspace, packageName) {
            return createRequire(path.resolve(workspace, 'package.json'))(`${packageName}/package.json`).version;
          }
          const checks = {
            rootReact: version('.', 'react'),
            rootReactDOM: version('.', 'react-dom'),
            webReact: version('apps/web', 'react'),
            webReactDOM: version('apps/web', 'react-dom'),
            adminReact: version('apps/admin', 'react'),
            adminReactDOM: version('apps/admin', 'react-dom'),
            mobileReact: version('apps/mobile', 'react'),
            mobileReactNative: version('apps/mobile', 'react-native'),
            mobileExpo: version('apps/mobile', 'expo'),
          };
          console.log(checks);
          for (const key of ['rootReact','rootReactDOM','webReact','webReactDOM','adminReact','adminReactDOM']) {
            if (checks[key] !== '19.2.8') throw new Error(`${key} must remain 19.2.8, got ${checks[key]}`);
          }
          if (checks.mobileReact !== '19.2.0') throw new Error(`Mobile React must be 19.2.0, got ${checks.mobileReact}`);
          if (checks.mobileReactNative !== '0.83.10') throw new Error(`Mobile RN must be 0.83.10, got ${checks.mobileReactNative}`);
          if (checks.mobileExpo !== '55.0.31') throw new Error(`Mobile Expo must be 55.0.31, got ${checks.mobileExpo}`);
          NODE

      - name: Typecheck mobile app
        run: pnpm --filter @irexpro/mobile typecheck

      - name: Export Android bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform android
          --output-dir .ci-export-android
          --clear

      - name: Export iOS bundle
        run: >-
          pnpm --filter @irexpro/mobile exec expo export
          --platform ios
          --output-dir .ci-export-ios
          --clear

      - name: Build web app after root lockfile change
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3999/api/v1'
        run: pnpm --filter @irexpro/web build

      - name: Build admin app after root lockfile change
        env:
          NEXT_PUBLIC_API_BASE_URL: 'http://localhost:3998/api/v1'
        run: pnpm --filter @irexpro/admin build

      - name: Remove disposable Metro exports
        run: rm -rf apps/mobile/.ci-export-android apps/mobile/.ci-export-ios

      - name: Generate disposable Android and iOS native projects
        run: pnpm --filter @irexpro/mobile exec expo prebuild --platform all --no-install --clean

      - name: Contain prebuild tracked-file mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Prebuild tracked mutations:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            test "$path" = 'apps/mobile/package.json'
          done

      - name: Prove generated SDK 55 native configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Android New Architecture markers:'
          grep -n 'newArchEnabled' apps/mobile/android/gradle.properties || true
          echo 'Android System UI markers:'
          grep -n 'expo_system_ui_user_interface_style' apps/mobile/android/app/src/main/res/values/strings.xml
          echo 'iOS New Architecture markers:'
          grep -nE 'newArchEnabled|RCT_NEW_ARCH_ENABLED' apps/mobile/ios/Podfile apps/mobile/ios/Podfile.properties.json || true

          ! grep -Eq '^newArchEnabled=false$' apps/mobile/android/gradle.properties
          grep -q 'expo_system_ui_user_interface_style' apps/mobile/android/app/src/main/res/values/strings.xml
          grep -Eq '>dark<|>Dark<' apps/mobile/android/app/src/main/res/values/strings.xml
          ! grep -Eq 'newArchEnabled[^\n]*false' apps/mobile/ios/Podfile
          node <<'NODE'
          const fs = require('node:fs');
          const props = JSON.parse(fs.readFileSync('apps/mobile/ios/Podfile.properties.json', 'utf8'));
          if (props.newArchEnabled === 'false') throw new Error('Generated iOS project opts out of New Architecture');
          console.log(`Generated iOS project does not opt out of New Architecture (property=${JSON.stringify(props.newArchEnabled)}).`);
          NODE
          ! grep -R --include='*.json' --include='*.properties' --include='*.gradle' --include='Podfile*' -n 'useHermesV1.*true' apps/mobile/android apps/mobile/ios
          echo 'Generated Android/iOS projects contain no Legacy Architecture opt-out, Android System UI is dark, and Hermes v1 is not opted in.'

      - name: Restore disposable prebuild source mutation
        if: ${{ always() }}
        run: git checkout -- apps/mobile/package.json

      - name: Remove disposable native projects
        if: ${{ always() }}
        run: rm -rf apps/mobile/android apps/mobile/ios apps/mobile/.ci-export-android apps/mobile/.ci-export-ios

      - name: Require clean tracked tree
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
