version: '3.9'

# iRexPro — Development Docker Compose
# Start: docker compose up -d
# Stop: docker compose down
# Logs: docker compose logs -f api

services:
  postgres:
    image: postgres:15-alpine
    container_name: irexpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: irexpro_dev
      POSTGRES_USER: irexpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-irexpro_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irexpro -d irexpro_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: irexpro_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: irexpro_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
    command: pnpm start:dev

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: irexpro_ai_engine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_ENGINE_ENV: development
      AI_ENGINE_PORT: 8001
      AI_SIGNAL_MODE: paper
      NESTJS_API_BASE_URL: http://api:3000/api/v1
      NESTJS_AI_SIGNAL_ENDPOINT: /ai/internal/signals
      NESTJS_INTERNAL_API_KEY: ${NESTJS_INTERNAL_API_KEY:-dev_internal_key_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-irexpro_redis_dev_password}
      REDIS_DB: 1
      AI_DEFAULT_MODEL_VERSION: baseline-xgboost-v0.1.0
      AI_MIN_CONFIDENCE_SCORE: "0.60"
    ports:
      - '8001:8001'
    # No real secrets in this file — override via .env or secrets manager in production

volumes:
  postgres_data:
  redis_data:
